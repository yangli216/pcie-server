worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep duplicate slashes visible so non-canonical AI paths reach the reject rule.
    merge_slashes off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    log_format pcie '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" upstream=$upstream_addr';
    access_log /dev/stdout pcie;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Normal business and administration traffic has one primary node.
    upstream pcie_primary {
        zone pcie_primary 64k;
        server pcie-primary:8080 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    # Only the four exact long-running AI paths use this pool.
    upstream pcie_long {
        zone pcie_long 64k;
        least_conn;
        server pcie-primary:8080 max_fails=2 fail_timeout=10s;
        server pcie-capacity:8080 max_fails=2 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 8080;
        server_name _;

        # Local test-only routing evidence. It reports the selected upstream address.
        proxy_hide_header X-PCIE-Upstream;
        add_header X-PCIE-Upstream $upstream_addr always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # Signed WebSocket parameters are carried in the query and must not be logged.
        location = /v1/ai/speech/realtime/ws {
            access_log off;
            proxy_pass http://pcie_long;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # This endpoint serves both ordinary responses and SSE.
        location = /v1/ai/chat {
            proxy_pass http://pcie_long;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
        }

        location = /v1/ai/speech/transcribe {
            client_max_body_size 2048m;
            proxy_pass http://pcie_long;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location = /v1/ai/speech/realtime {
            client_max_body_size 2048m;
            proxy_pass http://pcie_long;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Reject every non-canonical AI path instead of falling back to the primary node.
        location ~ "^/+v1/+ai(?:/+|;|$)" {
            access_log off;
            return 404;
        }

        location ^~ /admin/api/releases {
            client_max_body_size 2048m;
            proxy_pass http://pcie_primary;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Every other path remains on the primary node.
        location / {
            proxy_pass http://pcie_primary;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
        }
    }
}
