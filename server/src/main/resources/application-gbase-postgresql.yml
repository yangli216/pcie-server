server:
  port: ${FB_SERVER_PORT:18090}

spring:
  datasource:
    driver-class-name: ${FB_DB_DRIVER:cn.gbase.Driver}
    url: ${FB_DB_URL}
    username: ${FB_DB_USERNAME}
    password: ${FB_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: never

mybatis-plus:
  db-type: ${FB_DB_TYPE:gbase-postgresql}

logging:
  file:
    path: ${FB_LOG_PATH:${java.io.tmpdir}/pcie-gbase-postgresql/logs}
